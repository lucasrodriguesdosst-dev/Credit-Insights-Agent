<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Insights – Processing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }

    /* Rotating ring */
    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .spin-slow { animation: spin-slow 3s linear infinite; }
    @keyframes spin-reverse { to { transform: rotate(-360deg); } }
    .spin-reverse { animation: spin-reverse 4s linear infinite; }

    /* Dot bounce */
    @keyframes bounce-dot {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }
    .dot { animation: bounce-dot 1.4s ease-in-out infinite both; }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* Progress bar shimmer */
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .shimmer {
      background: linear-gradient(90deg, #3b82f6 0%, #818cf8 40%, #6366f1 60%, #3b82f6 100%);
      background-size: 200% auto;
      animation: shimmer 2s linear infinite;
    }

    /* Step fade-in */
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fade-in 0.4s ease forwards; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-indigo-900 flex items-center justify-center p-4">

  <!-- Blobs -->
  <div class="absolute top-0 left-0 w-96 h-96 bg-blue-600 opacity-10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-600 opacity-10 rounded-full blur-3xl translate-x-1/2 translate-y-1/2 pointer-events-none"></div>

  <div class="relative w-full max-w-sm text-white text-center">

    <!-- Spinner rings -->
    <div class="relative flex items-center justify-center mb-10">
      <!-- Outer ring -->
      <svg class="absolute w-40 h-40 spin-slow" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="80" cy="80" r="72" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round" stroke-dasharray="100 352" />
        <defs>
          <linearGradient id="grad1" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
            <stop stop-color="#60a5fa"/>
            <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </svg>
      <!-- Inner ring -->
      <svg class="absolute w-28 h-28 spin-reverse" viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="56" cy="56" r="48" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 240" />
        <defs>
          <linearGradient id="grad2" x1="112" y1="0" x2="0" y2="112" gradientUnits="userSpaceOnUse">
            <stop stop-color="#a78bfa"/>
            <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </svg>
      <!-- Icon in centre -->
      <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-xl">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
          <line x1="1" y1="10" x2="23" y2="10"/>
        </svg>
      </div>
    </div>

    <!-- Heading -->
    <h1 class="text-2xl font-extrabold mb-2">Setting up your account</h1>
    <p class="text-white/55 text-sm mb-8" id="statusMsg">
      We are preparing your payment provider link&hellip;
    </p>

    <!-- Steps list -->
    <div class="bg-white/5 border border-white/10 rounded-2xl p-5 mb-8 text-left space-y-3" id="stepsList">
      <div class="flex items-center gap-3 text-sm" id="step1">
        <div class="w-6 h-6 rounded-full bg-green-500/20 border border-green-400/40 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="text-white/80">Authenticated successfully</span>
      </div>
      <div class="flex items-center gap-3 text-sm" id="step2">
        <div class="w-6 h-6 rounded-full bg-green-500/20 border border-green-400/40 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="text-white/80">Organisation created</span>
      </div>
      <div class="flex items-center gap-3 text-sm" id="step3">
        <div class="w-6 h-6 rounded-full bg-blue-500/20 border border-blue-400/40 flex items-center justify-center shrink-0 animate-pulse">
          <div class="w-2 h-2 rounded-full bg-blue-400"></div>
        </div>
        <span class="text-white/60">Waiting for payment provider link</span>
      </div>
    </div>

    <!-- Shimmer progress bar -->
    <div class="w-full bg-white/10 rounded-full h-1.5 mb-6 overflow-hidden">
      <div class="h-full rounded-full shimmer w-2/3"></div>
    </div>

    <!-- Animated dots -->
    <div class="flex justify-center gap-2">
      <div class="dot w-2.5 h-2.5 rounded-full bg-blue-400"></div>
      <div class="dot w-2.5 h-2.5 rounded-full bg-indigo-400"></div>
      <div class="dot w-2.5 h-2.5 rounded-full bg-purple-400"></div>
    </div>

    <!-- Error state (hidden by default) -->
    <div id="errorBanner" class="hidden mt-6 flex items-center gap-2 bg-red-500/20 border border-red-400/40 text-red-200 rounded-xl px-4 py-3 text-sm text-left">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="errorMsg">An error occurred.</span>
    </div>
  </div>

  <script>
    const POLL_INTERVAL_MS = 3000;   // poll every 3 s
    const MAX_ATTEMPTS     = 60;     // give up after ~3 minutes

    let attempts = 0;

    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      document.getElementById('errorMsg').textContent = msg;
      banner.classList.remove('hidden');
      banner.classList.add('flex');
    }

    function markStepDone(stepId) {
      const el = document.getElementById(stepId);
      if (!el) return;
      el.querySelector('.animate-pulse')?.classList.remove('animate-pulse');
      const dot = el.querySelector('.bg-blue-400');
      if (dot) {
        dot.parentElement.classList.remove('bg-blue-500/20', 'border-blue-400/40');
        dot.parentElement.classList.add('bg-green-500/20', 'border-green-400/40');
        dot.parentElement.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      }
      el.querySelector('span').classList.remove('text-white/60');
      el.querySelector('span').classList.add('text-white/80');
    }

    async function poll() {
      if (attempts >= MAX_ATTEMPTS) {
        showError('Timed out waiting for the payment provider link. Please reload and try again.');
        return;
      }
      attempts++;

      try {
        const res = await fetch('/api/check-payment-link');
        const data = await res.json();

        if (data.status === 'ready' && data.link) {
          // Mark step 3 done
          markStepDone('step3');
          document.getElementById('statusMsg').textContent = 'Redirecting you now…';
          setTimeout(() => { window.location.href = data.link; }, 800);
          return;
        }

        if (data.error) {
          showError(data.error);
          return;
        }

        // Still pending – keep polling
        setTimeout(poll, POLL_INTERVAL_MS);

      } catch (err) {
        showError('Network error: ' + err.message);
      }
    }

    // Start polling after a short delay
    setTimeout(poll, 1000);
  </script>
</body>
</html>
