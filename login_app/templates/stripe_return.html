<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Insights – Bank account confirmation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }

    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .spin-slow { animation: spin-slow 3s linear infinite; }
    @keyframes spin-reverse { to { transform: rotate(-360deg); } }
    .spin-reverse { animation: spin-reverse 4s linear infinite; }

    @keyframes bounce-dot {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }
    .dot { animation: bounce-dot 1.4s ease-in-out infinite both; }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .shimmer {
      background: linear-gradient(90deg, #3b82f6 0%, #818cf8 40%, #6366f1 60%, #3b82f6 100%);
      background-size: 200% auto;
      animation: shimmer 2s linear infinite;
    }
    .shimmer-green {
      background: linear-gradient(90deg, #10b981 0%, #34d399 40%, #6ee7b7 60%, #10b981 100%);
      background-size: 200% auto;
      animation: shimmer 2s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-indigo-900 flex items-center justify-center p-4">

  <div class="absolute top-0 left-0 w-96 h-96 bg-blue-600 opacity-10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-600 opacity-10 rounded-full blur-3xl translate-x-1/2 translate-y-1/2 pointer-events-none"></div>

  <div class="relative w-full max-w-sm text-white text-center">

    <!-- Spinner rings (hidden when done) -->
    <div class="relative flex items-center justify-center mb-10" id="spinnerBlock">
      <svg class="absolute w-40 h-40 spin-slow" viewBox="0 0 160 160" fill="none">
        <circle cx="80" cy="80" r="72" stroke="url(#g1)" stroke-width="4" stroke-linecap="round" stroke-dasharray="100 352" />
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
            <stop stop-color="#60a5fa"/>
            <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </svg>
      <svg class="absolute w-28 h-28 spin-reverse" viewBox="0 0 112 112" fill="none">
        <circle cx="56" cy="56" r="48" stroke="url(#g2)" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 240" />
        <defs>
          <linearGradient id="g2" x1="112" y1="0" x2="0" y2="112" gradientUnits="userSpaceOnUse">
            <stop stop-color="#a78bfa"/>
            <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-xl">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
          <line x1="1" y1="10" x2="23" y2="10"/>
        </svg>
      </div>
    </div>

    <!-- Success icon (hidden by default) -->
    <div class="hidden relative flex items-center justify-center mb-10" id="successBlock">
      <div class="w-20 h-20 bg-gradient-to-br from-green-400 to-emerald-600 rounded-full flex items-center justify-center shadow-xl shadow-green-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
    </div>

    <h1 class="text-2xl font-extrabold mb-2" id="heading">Confirming your bank account</h1>
    <p class="text-white/55 text-sm mb-8" id="statusMsg">
      We are verifying your bank information with Stripe&hellip;
    </p>

    <!-- Steps -->
    <div class="bg-white/5 border border-white/10 rounded-2xl p-5 mb-8 text-left space-y-3">
      <div class="flex items-center gap-3 text-sm">
        <div class="w-6 h-6 rounded-full bg-green-500/20 border border-green-400/40 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="text-white/80">Organisation created</span>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <div class="w-6 h-6 rounded-full bg-green-500/20 border border-green-400/40 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="text-white/80">Stripe payment form submitted</span>
      </div>
      <div class="flex items-center gap-3 text-sm" id="stepBank">
        <div class="w-6 h-6 rounded-full bg-blue-500/20 border border-blue-400/40 flex items-center justify-center shrink-0 animate-pulse">
          <div class="w-2 h-2 rounded-full bg-blue-400"></div>
        </div>
        <span class="text-white/60" id="stepBankLabel">Waiting for bank account confirmation</span>
      </div>
    </div>

    <!-- State badge -->
    <div class="mb-6">
      <span class="text-xs text-white/40 uppercase tracking-widest">Current state</span>
      <div class="mt-1 inline-block px-3 py-1 rounded-full bg-white/10 text-white/70 text-sm font-mono" id="stateBadge">
        WAITING_FOR_BANK_INFO
      </div>
    </div>

    <!-- Progress bar -->
    <div class="w-full bg-white/10 rounded-full h-1.5 mb-6 overflow-hidden" id="progressBar">
      <div class="h-full rounded-full shimmer w-3/4" id="progressFill"></div>
    </div>

    <!-- Animated dots -->
    <div class="flex justify-center gap-2" id="dotsBlock">
      <div class="dot w-2.5 h-2.5 rounded-full bg-blue-400"></div>
      <div class="dot w-2.5 h-2.5 rounded-full bg-indigo-400"></div>
      <div class="dot w-2.5 h-2.5 rounded-full bg-purple-400"></div>
    </div>

    <!-- Error banner -->
    <div id="errorBanner" class="hidden mt-6 flex items-center gap-2 bg-red-500/20 border border-red-400/40 text-red-200 rounded-xl px-4 py-3 text-sm text-left">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="errorMsg">An error occurred.</span>
    </div>
  </div>

  <script>
    const POLL_INTERVAL_MS = 3000;
    const MAX_ATTEMPTS     = 60;   // ~3 minutes

    // States that mean "done" (bank info received / link no longer pending)
    const DONE_STATES = ['COMPLETED', 'ACTIVE', 'LINKED', 'BANK_INFO_RECEIVED'];

    let attempts = 0;

    function showError(msg) {
      document.getElementById('errorMsg').textContent = msg;
      const b = document.getElementById('errorBanner');
      b.classList.remove('hidden');
      b.classList.add('flex');
      document.getElementById('dotsBlock').classList.add('hidden');
    }

    function markBankStepDone() {
      const step = document.getElementById('stepBank');
      step.querySelector('.animate-pulse')?.classList.remove('animate-pulse');
      const iconWrap = step.querySelector('div');
      iconWrap.classList.remove('bg-blue-500/20', 'border-blue-400/40');
      iconWrap.classList.add('bg-green-500/20', 'border-green-400/40');
      iconWrap.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      document.getElementById('stepBankLabel').classList.remove('text-white/60');
      document.getElementById('stepBankLabel').classList.add('text-white/80');
      document.getElementById('stepBankLabel').textContent = 'Bank account confirmed';
    }

    function showSuccess(state) {
      markBankStepDone();

      document.getElementById('stateBadge').textContent = state;
      document.getElementById('stateBadge').classList.add('bg-green-500/20', 'text-green-300');

      document.getElementById('spinnerBlock').classList.add('hidden');
      const sb = document.getElementById('successBlock');
      sb.classList.remove('hidden');
      sb.classList.add('flex');

      document.getElementById('heading').textContent = 'Bank account confirmed!';
      document.getElementById('statusMsg').textContent = 'Your account is now set up and ready to use.';

      const fill = document.getElementById('progressFill');
      fill.classList.remove('shimmer');
      fill.classList.add('shimmer-green');
      fill.style.width = '100%';

      document.getElementById('dotsBlock').classList.add('hidden');
    }

    async function poll() {
      if (attempts >= MAX_ATTEMPTS) {
        showError('Timed out waiting for bank account confirmation. Please refresh or contact support.');
        return;
      }
      attempts++;

      try {
        const res  = await fetch('/api/check-lago-stripe-state');
        const data = await res.json();

        if (data.error) {
          showError(data.error);
          return;
        }

        const state = data.lagoStripeLinkState || '';
        document.getElementById('stateBadge').textContent = state || '—';

        if (state && !state.includes('WAITING') && (DONE_STATES.includes(state) || state !== 'WAITING_FOR_BANK_INFO')) {
          showSuccess(state);
          return;
        }

        // Still waiting – keep polling
        setTimeout(poll, POLL_INTERVAL_MS);

      } catch (err) {
        showError('Network error: ' + err.message);
      }
    }

    setTimeout(poll, 1500);
  </script>
</body>
</html>
